# =============================================================================
# Personal Knowledge Agent - docker-compose
# Three services: backend (LangGraph) + qdrant (vector DB) + frontend (Next.js)
#
# Quick start:
#   docker compose up --build
#   frontend  -> http://localhost:3000
#   backend   -> http://localhost:3001  (LangGraph Studio / API)
#
# Secrets: compose auto-reads variables from the repo-root .env
#   (OPENAI_API_KEY, OPENAI_BASE_URL, ...). They are NOT baked into images.
#
# Vault: mount your Obsidian vault via VAULT_HOST_PATH (default ../obsidian-vault).
#   export VAULT_HOST_PATH="E:/你的路径/面试八股文"
# =============================================================================
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pka-qdrant
    ports:
      - "6333:6333"   # REST API (also used by the backend via QDRANT_URL)
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pka-backend
    environment:
      # --- LLM provider (read from repo-root .env) ---
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      # --- Qdrant server mode (docker-compose service) ---
      QDRANT_URL: http://qdrant:6333
      # --- Knowledge base ---
      OBSIDIAN_VAULT_PATH: /app/vault
      # --- Model selection / behavior ---
      DEFAULT_MODEL_KEY: ${DEFAULT_MODEL_KEY:-deepseek-v4}
      GUARDRAILS_MODEL_KEY: ${GUARDRAILS_MODEL_KEY:-qwen3-8b}
      DISABLE_THINKING: "1"
      # --- Optional observability ---
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    ports:
      - "3001:3001"
    volumes:
      - ${VAULT_HOST_PATH:-../obsidian-vault}:/app/vault:ro
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pka-frontend
    # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time and runs in
    # the user's browser, so it must point at the host-published backend URL.
    environment:
      NEXT_PUBLIC_LANGGRAPH_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage:
