[project]
name = "personal-knowledge-agent"
version = "0.1.0"
description = "Personal Knowledge Management Agent — Obsidian-powered RAG with LangGraph + LlamaIndex"
authors = [
    { name = "Personal Knowledge Agent" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # LangGraph / LangChain core
    "langchain>=1.0.2",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-prebuilt>=0.7.0",
    # LLM providers
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.1.23",
    "langchain-google-genai>=4.0.0",
    "langchain-deepseek>=0.1.0",
    "langchain-baseten>=0.2.0,<0.3.0",
    # RAG pipeline
    "llama-index>=0.12.0",
    "llama-index-vector-stores-qdrant>=0.5.0",
    "llama-index-embeddings-openai>=0.3.0",
    "qdrant-client>=1.13.0",
    # MCP protocol
    "langchain-mcp-adapters>=0.2.2",
    "mcp>=1.0.0",
    # Observability
    "langsmith>=0.8.3",
    # API
    "fastapi>=0.136.1",
    # Utils
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "rapidfuzz>=3.0.0",
    # BM25 hybrid retrieval
    "scikit-learn>=1.3.0",
    "jieba>=0.42.1",
    # File watching
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
]
# Reranker support
reranker = ["FlagEmbedding>=1.3.0"]
# RAGAS evaluation
eval = ["ragas>=0.2.0", "datasets>=3.0.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",
    "F",
    "I",
    "D",
    "D401",
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-api>=0.5.33",
    "langgraph-cli[inmem]>=0.4.7",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
