# ---------------------------------------------------------------------------
# Personal Knowledge Agent - CI
# - test:  run the 86 unit tests (LLM calls are mocked)
# - docker: verify both images build (catches Dockerfile regressions)
# The test job imports `src.agent.config`, which instantiates an OpenAI
# client at import time. We inject a dummy OPENAI_API_KEY so the client
# constructs without contacting the network. Set OPENAI_BASE_URL too so
# any accidental real call would hit SiliconFlow (not api.openai.com).
# If `OPENAI_API_KEY` is exposed as a GitHub repo secret, prefer that over
# the literal dummy to mirror production routing.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Unit tests (no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-for-mock-only' }}
          OPENAI_BASE_URL: https://api.siliconflow.cn/v1
        run: python -m pytest tests/unit/ -q --cov=src --cov-report=term-missing

  docker:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pka-backend:ci .

      - name: Build frontend image
        run: docker build -t pka-frontend:ci ./frontend
